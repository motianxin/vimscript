-- Verilog / SystemVerilog ctags 配置（Tagbar 依赖）
-- 兼容 exuberant-ctags 5.8（CentOS 7），不使用 (?:...) 等扩展语法
--langdef=verilog
--langmap=verilog:.v.sv.vh.svh
--regex-verilog=/^[ \t]*module[ \t]+([a-zA-Z_][a-zA-Z0-9_]*)/\1/m,module/
--regex-verilog=/^[ \t]*class[ \t]+([a-zA-Z_][a-zA-Z0-9_]*)/\1/c,class/
--regex-verilog=/^[ \t]*task[ \t]+(automatic[ \t]+)?([a-zA-Z_][a-zA-Z0-9_]*)/\2/t,task/
--regex-verilog=/^[ \t]*function[ \t]+(automatic[ \t]+)?([a-zA-Z_][a-zA-Z0-9_]*)[ \t]*\(/\2/f,function/
--regex-verilog=/^[ \t]*(virtual[ \t]+)?function[ \t]+(void|bit|logic|int|integer|string|real|time)[ \t]+([a-zA-Z_][a-zA-Z0-9_]*)/\4/f,function/
--regex-verilog=/^[ \t]*parameter[ \t]+([a-zA-Z_][a-zA-Z0-9_]*)/\1/C,constant/
--regex-verilog=/^[ \t]*assign[ \t]+([a-zA-Z_][a-zA-Z0-9_]*)/\1/a,assign/
--regex-verilog=/`([a-zA-Z_][a-zA-Z0-9_]*)/\1/d,define/
